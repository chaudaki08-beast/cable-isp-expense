name: Keep Supabase awake

# Supabase free-tier projects pause after ~7 days of inactivity. This job runs
# once a day and makes one real database query, so the project never goes idle.
# It only uses the PUBLIC publishable key + project URL (both are already shipped
# to the browser in the deployed app) — never the secret key.

on:
  schedule:
    - cron: "17 6 * * *" # every day at 06:17 UTC
  workflow_dispatch: {} # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase (keeps the project active)
        run: |
          URL="https://xotprqgpyvxswjhphuux.supabase.co"
          KEY="sb_publishable_TwrEGT11WNV-cTYxbkCUxg_whvPse5f"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Unexpected status — the project may be paused or the key changed."
            exit 1
          fi
          echo "Project is awake."
